name: Mise à jour USD-CDF depuis la BCC

on:
  schedule:
    - cron: "15 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Collecter les cotations officielles BCC
        run: python scripts/update_site.py --days-back 14

      - name: Vérifier la cohérence
        run: python scripts/verify_site_data.py

      - name: Commit automatique
        run: |
          if git diff --quiet -- data/usd-cdf.json data/model.json data/analyses.json data/automation.json analysis/xgboost/data/raw/cours-de-change-quotidien.csv analysis/strategy/data/series_clean.csv; then
            echo "Aucune modification à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usd-cdf.json data/model.json data/analyses.json data/automation.json analysis/xgboost/data/raw/cours-de-change-quotidien.csv analysis/strategy/data/series_clean.csv
          git commit -m "chore(data): sync USD/CDF from BCC"
          git push
