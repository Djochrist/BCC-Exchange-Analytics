name: Réestimer les analyses USD-CDF

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Synchroniser la BCC et réestimer les modèles
        run: python scripts/update_site.py --days-back 14 --retrain --xgb-n-iter 30 --strategy-candidates 360

      - name: Vérifier la cohérence
        run: python scripts/verify_site_data.py

      - name: Commit des nouveaux résultats
        run: |
          if git diff --quiet -- data/usd-cdf.json data/model.json data/analyses.json data/automation.json analysis/xgboost analysis/strategy; then
            echo "Aucun nouveau résultat à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usd-cdf.json data/model.json data/analyses.json data/automation.json analysis/xgboost analysis/strategy
          git commit -m "chore(models): refresh USD-CDF analyses"
          git push
